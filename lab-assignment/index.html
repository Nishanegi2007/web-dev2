<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async Weather Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Cascadia+Mono:ital,wght@0,200..700;1,200..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Share+Tech&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Async weather Tracker</h1>

        <div class="container1">

            <div class="searchBox" id="searchBox">
                <h3>Search City</h3>

                <form>
                    <input type="text" id="cityInput" placeholder="Delhi,Mumbai,etc....">
                    <button type="submit" id="btn">Search</button>
                </form>

                <div id="searchHistory">
                    <h3>Search History</h3>
                    <button id="clearHistoryBtn">Clear History</button>
                    <div class="searchedCities"></div>
                </div>

            </div>

            <div class="weatherInfo" id="weatherInfo">
                <h3>Weather Info</h3>
                <div id="fetchData"></div>
            </div>

        </div>

       
    <script src="script.js"></script>
</body>
</html>
